[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loophole-ring"
version = "0.1.0"
description = "Talk to an Ultrahuman ring over Bluetooth LE without the vendor app or an account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=3.0"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
loophole-ring = "loophole_ring.cli:main"

[tool.setuptools]
packages = ["loophole_ring"]

[tool.setuptools.package-data]
loophole_ring = ["web.html"]
